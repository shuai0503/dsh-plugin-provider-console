<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>AI 服务商账户控制台</title>
<style>
  :root {
    --bg: #f6f7f9; --panel: #ffffff; --border: #e3e6ec; --text: #1f2430;
    --muted: #6b7280; --accent: #2f5fd0; --ok: #12855b; --warn: #b7791f;
    --err: #c0392b; --soft: #f0f3f9; --code: #f7f8fb;
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--text);
    font: 14px/1.55 -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif; }
  .wrap { max-width: 1240px; margin: 0 auto; padding: 24px 20px 48px; }
  header { display: flex; align-items: center; gap: 14px; flex-wrap: wrap; margin-bottom: 20px; }
  h1 { font-size: 20px; margin: 0; font-weight: 650; letter-spacing: .2px; }
  .sub { color: var(--muted); font-size: 12px; }
  .spacer { flex: 1; }
  button { font: inherit; padding: 7px 14px; border: 1px solid var(--border); border-radius: 8px;
    background: var(--panel); color: var(--text); cursor: pointer; }
  button.primary { background: var(--accent); color: #fff; border-color: var(--accent); }
  button:hover { filter: brightness(.97); }
  button:disabled { opacity: .55; cursor: default; }
  .cards { display: grid; grid-template-columns: repeat(auto-fit, minmax(180px, 1fr)); gap: 12px; margin-bottom: 16px; }
  .card { background: var(--panel); border: 1px solid var(--border); border-radius: 12px; padding: 14px 16px; }
  .card .k { color: var(--muted); font-size: 12px; }
  .card .v { font-size: 24px; font-weight: 650; margin-top: 4px; font-variant-numeric: tabular-nums; }
  .card .v.small { font-size: 18px; }
  .panel { background: var(--panel); border: 1px solid var(--border); border-radius: 12px; padding: 16px; margin-bottom: 16px; }
  .panel h2 { font-size: 14px; margin: 0 0 12px; font-weight: 650; }
  table { width: 100%; border-collapse: collapse; font-variant-numeric: tabular-nums; }
  th, td { text-align: left; padding: 9px 10px; border-bottom: 1px solid var(--border); vertical-align: top; }
  th { color: var(--muted); font-weight: 500; font-size: 12px; background: var(--soft); }
  tr:last-child td { border-bottom: 0; }
  .badge { display: inline-block; padding: 1px 8px; border-radius: 999px; font-size: 12px; border: 1px solid transparent; }
  .b-ok { color: var(--ok); background: #e8f6ef; border-color: #c8e9d9; }
  .b-stale, .b-manual { color: var(--warn); background: #fdf4e3; border-color: #f2dfb8; }
  .b-error { color: var(--err); background: #fdeceb; border-color: #f5cdc9; }
  .b-unsupported { color: var(--muted); background: var(--soft); border-color: var(--border); }
  .money { font-weight: 650; }
  .muted { color: var(--muted); }
  .tiny { font-size: 12px; }
  .warn-box { border-left: 3px solid var(--warn); background: #fffaf0; padding: 10px 12px; border-radius: 6px; margin-top: 12px; }
  .warn-box ul { margin: 4px 0 0; padding-left: 18px; }
  .grid2 { display: grid; grid-template-columns: minmax(0, 1.35fr) minmax(300px, 1fr); gap: 16px; align-items: start; }
  @media (max-width: 960px) { .grid2 { grid-template-columns: 1fr; } }
  label { display: block; font-size: 12px; color: var(--muted); margin: 0 0 4px; }
  input, select, textarea { width: 100%; font: inherit; padding: 7px 9px; border: 1px solid var(--border);
    border-radius: 8px; background: #fff; color: var(--text); }
  textarea { resize: vertical; min-height: 76px; }
  .row { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px; margin-bottom: 10px; }
  .row3 { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 10px; margin-bottom: 10px; }
  .check { display: flex; align-items: center; gap: 6px; color: var(--text); font-size: 13px; }
  .check input { width: auto; }
  pre { background: var(--code); border: 1px solid var(--border); border-radius: 8px; padding: 12px;
    white-space: pre-wrap; word-break: break-word; max-height: 360px; overflow: auto; font-size: 12.5px; }
  .foot { color: var(--muted); font-size: 12px; margin-top: 8px; }
  .dot { width: 8px; height: 8px; border-radius: 50%; display: inline-block; background: var(--ok); }
  .dot.off { background: var(--err); }

  /* embed=1：被宿主左侧面板 iframe 内嵌时贴合宿主暗色主题并压缩留白。 */
  html.embed body { --bg: #171a21; --panel: #1f2531; --border: #323a4a; --text: #e7eaf0;
    --muted: #9aa3b5; --soft: #262d3b; --code: #141821; --accent: #5b8cff; }
  html.embed .wrap { max-width: none; padding: 14px 16px 28px; }
  html.embed header { margin-bottom: 14px; }
  html.embed header h1 { display: none; }
  html.embed .card, html.embed .panel, html.embed pre, html.embed input,
  html.embed select, html.embed textarea { background: var(--panel); color: var(--text); border-color: var(--border); }
  html.embed th { background: var(--soft); }
  html.embed button { background: var(--panel); color: var(--text); border-color: var(--border); }
  html.embed button.primary { background: var(--accent); color: #fff; border-color: var(--accent); }
  html.embed .b-ok { background: #16352a; border-color: #245c46; color: #6fd3a3; }
  html.embed .b-stale, html.embed .b-manual { background: #3a2f18; border-color: #6a5426; color: #e8c477; }
  html.embed .b-error { background: #3d2020; border-color: #6d3232; color: #f0938d; }
  html.embed .b-unsupported { background: var(--soft); border-color: var(--border); color: var(--muted); }
  html.embed .warn-box { background: #2d2718; }
</style>
<script>if (new URLSearchParams(location.search).has('embed')) document.documentElement.classList.add('embed')</script>
</head>
<body>
<div class="wrap">
  <header>
    <h1>AI 服务商账户控制台</h1>
    <span class="sub"><span class="dot" id="dot"></span> <span id="conn">连接中</span> · <span id="updated">尚未刷新</span></span>
    <span class="spacer"></span>
    <label class="check"><input type="checkbox" id="auto" checked /> 自动刷新</label>
    <button id="refresh">立即刷新</button>
  </header>

  <div class="cards">
    <div class="card"><div class="k">可用余额合计（CNY）</div><div class="v" id="totalCny">—</div></div>
    <div class="card"><div class="k">可用余额合计（USD）</div><div class="v" id="totalUsd">—</div></div>
    <div class="card"><div class="k">账户 / 实时 / 异常</div><div class="v small" id="counts">—</div></div>
    <div class="card"><div class="k">服务商</div><div class="v small" id="providerCount">—</div></div>
  </div>

  <div class="grid2">
    <div class="panel">
      <h2>账户余额与配额</h2>
      <table>
        <thead><tr><th>账户</th><th>服务商</th><th>状态</th><th>余额 / 配额</th><th>构成</th><th>更新</th></tr></thead>
        <tbody id="rows"><tr><td colspan="6" class="muted">加载中…</td></tr></tbody>
      </table>
      <div id="warnings"></div>
      <div class="foot">「不支持」= 该平台无按 API Key 查询余额的公开接口；可在账户配置里设 <code>balancePreset: manual</code> 手工录入。</div>
    </div>

    <div>
      <div class="panel">
        <h2>通用 API 调用</h2>
        <div class="row">
          <div><label>账户</label><select id="account"></select></div>
          <div><label>模型</label><input id="model" list="modelList" placeholder="留空用默认模型" /><datalist id="modelList"></datalist></div>
        </div>
        <div><label>提示词</label><textarea id="prompt" placeholder="说一句话说明你是谁"></textarea></div>
        <div class="row3" style="margin-top:10px">
          <div><label>temperature</label><input id="temp" type="number" step="0.1" min="0" max="2" value="0.7" /></div>
          <div><label>max_tokens</label><input id="maxTokens" type="number" min="1" value="512" /></div>
          <div><label>&nbsp;</label><label class="check" style="margin:6px 0 0"><input type="checkbox" id="dryRun" /> dry-run</label></div>
        </div>
        <button class="primary" id="call">发起调用</button>
        <div class="foot">dry-run 只构造请求、不联网也不消耗额度，适合先验证配置。</div>
      </div>
      <div class="panel">
        <h2>结果</h2>
        <pre id="result">（尚未调用）</pre>
      </div>
    </div>
  </div>
</div>

<script>
const POLL_MS = __POLL_MS__;
const $ = (id) => document.getElementById(id);
let state = null;

function esc(text) {
  return String(text ?? '').replace(/[&<>"']/g, (c) => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}
function money(value, currency) {
  if (value === undefined || value === null) return '—';
  const symbol = currency === 'USD' ? '$' : currency === 'CNY' ? '¥' : (currency ? currency + ' ' : '¥');
  return symbol + Number(value).toFixed(2);
}
const LABELS = { ok: '实时', stale: '缓存', error: '失败', unsupported: '不支持', manual: '手工' };

function render(data) {
  state = data;
  const report = data.report || { accounts: [], totals: [], warnings: [], counts: {} };
  const accounts = data.accounts || [];
  const c = report.counts || {};
  const total = (cur) => (report.totals || []).find((t) => t.currency === cur);
  $('totalCny').textContent = money(total('CNY')?.total, 'CNY');
  $('totalUsd').textContent = money(total('USD')?.total, 'USD');
  $('counts').textContent = `${accounts.length} / ${c.ok || 0} / ${(c.error || 0) + (c.stale || 0)}`;
  $('providerCount').textContent = (data.providers || []).length + ' 个';
  $('updated').textContent = '更新于 ' + new Date(report.generatedAt || Date.now()).toLocaleTimeString();
  $('conn').textContent = '已连接';
  $('dot').className = 'dot';

  const rows = report.accounts || [];
  $('rows').innerHTML = rows.length ? rows.map((item) => {
    const breakdown = Object.entries(item.breakdown || {}).map(([k, v]) => `${esc(k)} ${money(v, item.currency)}`).join(' / ') || '—';
    let value = '—';
    if (item.total !== undefined && item.total !== null) value = '<span class="money">' + money(item.total, item.currency) + '</span>';
    else if (item.quotas && item.quotas.length) value = item.quotas.map((q) => esc(q.name) + ' ' + (q.usedPercent !== undefined ? q.usedPercent + '% 已用' : (q.remaining ?? '?') + '/' + (q.limit ?? '?'))).join('；');
    const extra = item.error ? `<div class="tiny" style="color:var(--err)">${esc(item.error.message)}</div>`
      : item.note ? `<div class="tiny muted">${esc(item.note)}</div>` : '';
    return `<tr>
      <td><strong>${esc(item.label)}</strong><div class="tiny muted">${esc(item.accountId)}</div>${extra}</td>
      <td>${esc(item.providerId)}</td>
      <td><span class="badge b-${esc(item.status)}">${LABELS[item.status] || esc(item.status)}</span>${item.stale ? '<div class="tiny muted">旧数据</div>' : ''}</td>
      <td>${value}</td><td class="tiny">${breakdown}</td>
      <td class="tiny muted">${new Date(item.fetchedAt).toLocaleTimeString()}</td></tr>`;
  }).join('') : '<tr><td colspan="6" class="muted">没有启用的账户。请在 cordis.patch.yml / accountsDir 中添加。</td></tr>';

  const warns = [...new Set(report.warnings || [])];
  $('warnings').innerHTML = warns.length
    ? `<div class="warn-box"><strong>预警 ${warns.length} 条</strong><ul>${warns.map((w) => `<li>${esc(w)}</li>`).join('')}</ul></div>` : '';

  const select = $('account');
  const current = select.value;
  select.innerHTML = accounts.filter((a) => a.enabled).map((a) => `<option value="${esc(a.id)}">${esc(a.label)} (${esc(a.provider)})</option>`).join('');
  if (accounts.some((a) => a.id === current)) select.value = current;
}

async function loadState() {
  try {
    const res = await fetch('/api/state', { cache: 'no-store' });
    if (!res.ok) throw new Error('HTTP ' + res.status);
    render(await res.json());
  } catch (e) {
    $('conn').textContent = '连接失败';
    $('dot').className = 'dot off';
  }
}
async function refresh() {
  const btn = $('refresh');
  btn.disabled = true; btn.textContent = '刷新中…';
  try {
    const res = await fetch('/api/refresh', { method: 'POST' });
    if (!res.ok) throw new Error('HTTP ' + res.status);
    const data = await res.json();
    const stateRes = await fetch('/api/state', { cache: 'no-store' });
    const stateData = await stateRes.json();
    stateData.report = data.report;
    render(stateData);
  } catch (e) { $('conn').textContent = '刷新失败：' + e.message; $('dot').className = 'dot off'; }
  finally { btn.disabled = false; btn.textContent = '立即刷新'; }
}
async function loadModels() {
  const id = $('account').value;
  if (!id) return;
  try {
    const res = await fetch('/api/models?accountId=' + encodeURIComponent(id));
    const data = await res.json();
    $('modelList').innerHTML = (data.models || []).map((m) => `<option value="${esc(m)}"></option>`).join('');
    if (!$('model').value && data.models && data.models.length) $('model').placeholder = '默认：' + data.models[0];
  } catch (_) {}
}
async function call() {
  const btn = $('call');
  btn.disabled = true; $('result').textContent = '请求中…';
  try {
    const payload = {
      accountId: $('account').value,
      model: $('model').value || undefined,
      prompt: $('prompt').value || '说一句话说明你是谁',
      parameters: { temperature: Number($('temp').value), max_tokens: Number($('maxTokens').value) },
      dryRun: $('dryRun').checked,
      includeRaw: true
    };
    const res = await fetch('/api/call', { method: 'POST', headers: { 'content-type': 'application/json' }, body: JSON.stringify(payload) });
    const data = await res.json();
    $('result').textContent = data.error
      ? `[${data.error.kind}] ${data.error.message}\n建议：${data.error.hint}`
      : (data.content || JSON.stringify(data.request || data, null, 2)) +
        (data.usage ? `\n\nToken: ${data.usage.promptTokens ?? '?'} + ${data.usage.completionTokens ?? '?'} = ${data.usage.totalTokens ?? '?'}` : '');
  } catch (e) { $('result').textContent = '调用失败：' + e.message; }
  finally { btn.disabled = false; }
}

$('refresh').addEventListener('click', refresh);
$('call').addEventListener('click', call);
$('account').addEventListener('change', loadModels);
loadState().then(loadModels);
setInterval(() => { if ($('auto').checked) loadState(); }, POLL_MS);
$('auto').addEventListener('change', () => { if ($('auto').checked) loadState(); });
setInterval(() => { if ($('auto').checked) refresh(); }, Math.max(POLL_MS, 60000));
</script>
</body>
</html>
