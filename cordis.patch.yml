# =============================================================================
# dsh-plugin-provider-console 的默认挂载配置（随包发布，作为 profile 的一层）
#
# 这里只保留「开箱即用」需要的最少设置：
#   - 内置服务商全部可用
#   - 自动探测已配置的 API Key（零配置）
#   - 本地看板 + 左侧栏入口开启
#
# 不要在这里写密钥。密钥的正确落点是 DSH 的凭据服务：
#   1) DSH 设置 → 模型/凭据页填一次（写入 ~/.dsh/.credentials.yaml）—— 自动探测会命中
#   2) 或在账户里写 apiKey: "${DEEPSEEK_API_KEY}" 由环境变量提供
#
# 需要多账户、自定义标签、预警阈值时，在你的 profile 的 cordis.patch.yml
# 里覆盖同 id 的 config 即可；已显式配置的账户永远优先于自动探测。
# 完整示例见 examples/cordis.patch.example.yml
# =============================================================================

- insert:
    - id: provider-console
      name: dsh-plugin-provider-console
      config:
        # 自动探测：有哪个服务的 Key 就自动建哪个账户，不需要手写 accounts
        autoDiscover: true

        # 内置服务商的声明式规格（DeepSeek / Kimi / 智谱 / 硅基流动 / 百炼 / 火山 / 千帆 / 混元）
        includeBuiltinProviders: true

        # 网络
        requestTimeoutMs: 15000
        retries: 1
        retryBaseMs: 250
        concurrency: 4

        # 余额缓存
        cacheTtlMs: 60000
        autoRefreshMs: 0
        lowBalanceThreshold: 20

        # 通用调用
        maxOutputChars: 8000
        allowStream: false
        allowRawRequests: true

        # 本地看板（只绑 127.0.0.1，不监听外网）
        dashboard:
          enabled: true
          host: 127.0.0.1
          port: 8788
          pollMs: 5000

        # 左侧栏「服务商控制台」入口
        sidebar:
          enabled: true
          label: 服务商控制台
          order: 20
